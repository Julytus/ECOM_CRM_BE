services:
  # Minio
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
    volumes:
      - ./volumes/minio_data:/data
    command: server --console-address ":9001" /data
    networks:
      - july

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - july

  mysql:
      image: mysql:8.1.0
      container_name: mysql
      restart: always
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 30s
        timeout: 10s
        retries: 5
      environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MYSQL_DATABASE: ${MYSQL_DATABASE}
        TZ: Asia/Ho_Chi_Minh
      command: --default-time-zone='+07:00' --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      ports:
        - "${MYSQL_PORT}:3306"
      volumes:
        - /etc/localtime:/etc/localtime:ro
        - /etc/timezone:/etc/timezone:ro
      networks:
        - july

#  postgres:
#    image: postgres:16-alpine
#    container_name: postgres
#    restart: unless-stopped
#    environment:
#      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
#      POSTGRES_USER: ${POSTGRES_USER}
#      POSTGRES_DB: ${POSTGRES_DB}
#    volumes:
#      - postgres-data:/var/lib/postgresql/data
#    ports:
#      - "5432:5432"
#    networks:
#      - july

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: "root"
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      - mysql
    networks:
      - july

  cloudflare:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - july

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html
    networks:
      - july

  backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: backend
      depends_on:
        mysql:
          condition: service_healthy
        minio:
          condition: service_started
      environment:
        - BACKEND_PORT=8088
        - SOCKET_IO_PORT=9099
        - REDIS_HOST=redis
        - REDIS_PORT=${REDIS_PORT:-6379}
        - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
        - TZ=Asia/Ho_Chi_Minh
        # Tùy chọn: set timezone cho JVM (rất khuyến khích cho Spring Boot)
        - JAVA_OPTS=-Duser.timezone=Asia/Ho_Chi_Minh
      ports:
        - "8088:8088"
        - "9099:9099"
      volumes:
        - /etc/localtime:/etc/localtime:ro
        - /etc/timezone:/etc/timezone:ro
      networks:
        - july

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "${FE_PORT:-4200}:80"
    networks:
      - july

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    networks:
      - july

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    networks:
      - july

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    networks:
      - july
      
  ollama-init:
    image: curlimages/curl:latest
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
      sleep 5 &&
      curl http://ollama:11434/api/pull -d '{\"name\": \"nomic-embed-text\"}'
      "

  qdrant-init:
    image: curlimages/curl:latest
    depends_on:
      - qdrant
    entrypoint: >
      sh -c "
      sleep 5 &&
      curl -X PUT 'http://qdrant:6333/collections/crm_entities' \
      -H 'Content-Type: application/json' \
      -d '{
        \"vectors\": {
          \"size\": 768,
          \"distance\": \"Cosine\"
        }
      }'
      "


volumes:
  minio_data:
    name: minio
  postgres-data:
    name: postgres
  redis-data:
    name: redis
  qdrant_storage:
    name: qdrant_storage
  n8n_data:
    name: n8n_data
  ollama_data:
    name: ollama_data

networks:
  july:
    driver: bridge
