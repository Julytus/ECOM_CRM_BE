<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Success</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Bootstrap (có thể bỏ nếu project đã có) -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>
        ._success {
            box-shadow: 0 15px 25px #00000019;
            padding: 45px;
            width: 100%;
            text-align: center;
            margin: 40px auto;
            border-bottom: solid 4px #28a745;
        }

        ._success i {
            font-size: 55px;
            color: #28a745;
        }

        ._success h2 {
            margin-bottom: 12px;
            font-size: 40px;
            font-weight: 500;
            line-height: 1.2;
            margin-top: 10px;
        }

        ._success p {
            margin-bottom: 0px;
            font-size: 18px;
            color: #495057;
            font-weight: 500;
        }

        .btn-group {
            margin-top: 25px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="message-box _success">

                <i class="fa fa-check-circle" aria-hidden="true"></i>

                <h2>Your payment was successful</h2>

                <p>
                    Thank you for your payment.<br>
                    We will be in contact with more details shortly.
                </p>

                <!-- BUTTON -->
                <div class="btn-group">
                    <a href="https://dat.aeoc.io.vn/invoice" class="btn btn-success">Back to Home</a>
                </div>

            </div>

        </div>
    </div>

</div>

<script>
    /**
     * Backend redirect:
     * /order-result.html?invoiceId=123&transactionId=456
     */

    const params = new URLSearchParams(window.location.search);
    document.getElementById("invoiceId").innerText = params.get("invoiceId") || "-";
    document.getElementById("transactionId").innerText = params.get("transactionId") || "-";
</script>

</body>
</html>
